name: Frontend CI/CD

on:
  push:
    branches: [ main ]
    paths:
      - 'FrontEnd/**'

jobs:
  build-fe:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: FrontEnd

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Node
        uses: actions/setup-node@v3
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Build Angular
        run: npm run build --configuration production
